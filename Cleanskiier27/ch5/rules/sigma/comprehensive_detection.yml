title: Comprehensive Malware Family Detection - Data Exfiltration via HTTPS
id: ch5-malware-exfiltration-https-08
description: Detects data exfiltration through HTTPS POST requests
logsource:
  category: proxy
  product: windows
detection:
  selection_https:
    c-ip|contains:
      - '192.168'
      - '10.'
      - '172.'
  selection_post:
    method: 'POST'
  selection_uri:
    c-uri|contains:
      - '/update/upload'
      - '/sync/upload'
      - '/beacon/report'
  selection_destination:
    cs-host|contains:
      - 'beacon.update-services.net'
      - 'c2.windowsupdate-sync.com'
  condition: selection_https and selection_post and (selection_uri or selection_destination)
level: high
status: experimental

