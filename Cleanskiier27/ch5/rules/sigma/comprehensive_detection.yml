title: Comprehensive Malware Family Detection - Registry Persistence
id: ch5-malware-persistence-registry-01
description: Detects registry-based persistence for Windows Update masquerading malware
logsource:
  category: registry_set
  product: windows
detection:
  selection_reg_path:
    RegistryPath|contains:
      - '\Software\Microsoft\Windows\CurrentVersion\Run'
      - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run'
  selection_value:
    RegistryValueName|contains:
      - 'WindowsUpdate'
      - 'wupdater'
      - 'wupdate'
  selection_data:
    RegistryValue|contains:
      - 'wupdater.exe'
      - 'windowsupdate'
      - 'System32'
  condition: selection_reg_path and (selection_value or selection_data)
level: high
status: experimental

---
title: Comprehensive Malware Family Detection - Process Injection
id: ch5-malware-injection-01
description: Detects process injection into system services
logsource:
  category: process_creation
  product: windows
detection:
  selection_injection:
    EventID: 10
    TargetImage|endswith:
      - 'svchost.exe'
      - 'lsass.exe'
      - 'services.exe'
    CallTrace|contains:
      - 'VirtualAllocEx'
      - 'WriteProcessMemory'
      - 'CreateRemoteThread'
  condition: selection_injection
level: critical
status: experimental

---
title: Comprehensive Malware Family Detection - Beacon Process Execution
id: ch5-malware-beacon-execution-02
description: Detects beacon process execution from dropper
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - 'wupdater.exe'
      - 'InstallUpdate.exe'
      - 'UpdateClient.exe'
  selection_child:
    Image|endswith:
      - 'cmd.exe'
      - 'powershell.exe'
  condition: selection_parent and selection_child
level: high
status: experimental

---
title: Comprehensive Malware Family Detection - Suspicious System Network Connections
id: ch5-malware-network-sys-03
description: Detects suspicious outbound connections from system processes
logsource:
  category: network_connection
  product: windows
detection:
  selection_sysprocess:
    Image|endswith:
      - 'svchost.exe'
      - 'services.exe'
  selection_network:
    DestinationPort: 443
    Initiated: 'true'
  selection_c2:
    DestinationHostname|contains:
      - 'beacon.update-services.net'
      - 'c2.windowsupdate-sync.com'
      - 'updatecenter.cloud-monitor.io'
      - '185.220.101.45'
      - '185.220.102.8'
  condition: selection_sysprocess and selection_network and selection_c2
level: critical
status: experimental

