title: Antivirus Detection - Process Enumeration
id: ch1-dropper-av-enum-10
description: Detects dropper enumerating antivirus processes
references:
  - https://attack.mitre.org/techniques/T1518/
tags:
  - attack.discovery
  - challenge.ch1
logsource:
  category: process_creation
  product: windows
detection:
