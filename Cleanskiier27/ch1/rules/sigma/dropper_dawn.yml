title: UAC Bypass Attempt - Registry Modification
id: ch1-dropper-uac-bypass-05
description: Detects UAC bypass combined with malicious registry modifications
references:
  - https://attack.mitre.org/techniques/T1548/002/
  - https://attack.mitre.org/techniques/T1547/001/
tags:
  - attack.privilege_escalation
  - attack.defense_evasion
  - challenge.ch1
logsource:
  category: registry_set
  product: windows
detection:
  selection_uac_bypass:
    Image|endswith:
      - 'fodhelper.exe'
      - 'eventvwr.exe'
      - 'msiexec.exe'
  selection_malicious_reg:
    RegistryPath|contains:
      - 'WindowsUpdate'
      - 'wupdater'
  condition: selection_uac_bypass and selection_malicious_reg
level: high
status: experimental

