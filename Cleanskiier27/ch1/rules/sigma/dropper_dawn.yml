title: Registry Persistence - WindowsUpdate Run Key Creation
id: ch1-dropper-persistence-01
description: Detects suspicious creation of Run registry key with WindowsUpdate name
references:
  - https://attack.mitre.org/techniques/T1547/001/
  - https://attack.mitre.org/techniques/T1036/005/
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.defense_evasion
  - challenge.ch1
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    RegistryPath|contains:
      - '\Software\Microsoft\Windows\CurrentVersion\Run'
      - '\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Run'
    RegistryValueName: 'WindowsUpdate'
    RegistryValue|contains: 'wupdater.exe'
  filter_legit:
    Image|endswith:
      - '\svchost.exe'
      - '\winlogon.exe'
      - '\system.exe'
  condition: selection and not filter_legit
level: high
status: experimental

---
title: Process Creation - wupdater.exe from Suspicious Parent
id: ch1-dropper-execution-02
description: Detects execution of wupdater.exe from non-standard parent processes
references:
  - https://attack.mitre.org/techniques/T1036/005/
tags:
  - attack.execution
  - attack.defense_evasion
  - challenge.ch1
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: 'wupdater.exe'
  filter_legit:
    ParentImage|endswith:
      - '\svchost.exe'
      - '\services.exe'
  condition: selection and not filter_legit
level: high
status: experimental

---
title: Suspicious File Creation in System32
id: ch1-dropper-file-drop-03
description: Detects dropper payload files written to System32 directory
references:
  - https://attack.mitre.org/techniques/T1036/005/
tags:
  - attack.defense_evasion
  - attack.execution
  - challenge.ch1
logsource:
  category: file_event
  product: windows
detection:
  selection:
    TargetFilename|contains: 'C:\Windows\System32\wupdate'
    TargetFilename|endswith: '.exe'
  filter_system:
    Image|endswith: 'explorer.exe'
  condition: selection and not filter_system
level: high
status: experimental

---
title: Registry Run Key Modification by Non-Standard Process
id: ch1-dropper-privilege-04
description: Detects write to HKLM Run key from user-level processes
references:
  - https://attack.mitre.org/techniques/T1547/001/
tags:
  - attack.persistence
  - attack.privilege_escalation
  - challenge.ch1
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    EventID: 4657
    RegistryPath|contains: '\Software\Microsoft\Windows\CurrentVersion\Run'
    RegistryHive: 'HKEY_LOCAL_MACHINE'
  filter_admin:
    ProcessId|contains: 'system'
  condition: selection and not filter_admin
level: high
status: experimental

