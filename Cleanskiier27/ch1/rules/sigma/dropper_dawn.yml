title: Scheduled Task Creation - WindowsUpdateClient
id: ch1-dropper-scheduled-task-06
description: Detects suspicious scheduled task creation with WindowsUpdate naming
references:
  - https://attack.mitre.org/techniques/T1547/010/
tags:
  - attack.persistence
  - challenge.ch1
logsource:
  category: process_creation
  product: windows
detection:
  selection_schtasks:
    Image|endswith: 'schtasks.exe'
    CommandLine|contains: '/create'
  selection_malicious:
    CommandLine|contains:
      - 'WindowsUpdateClient'
      - 'wupdater'
  condition: selection_schtasks and selection_malicious
level: medium
status: experimental

