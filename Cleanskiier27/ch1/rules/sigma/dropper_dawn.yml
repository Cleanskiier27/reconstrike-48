---
title: Dropper Process Tree - Complete Chain
id: ch1-dropper-process-tree-12
description: Detects complete dropper attack chain in process creation events
references:
  - https://attack.mitre.org/techniques/T1566/002/
tags:
  - attack.execution
  - attack.persistence
  - challenge.ch1
logsource:
  category: process_creation
  product: windows
detection:
  selection_dropper:
    Image|endswith: 'InstallUpdate.exe'
    CommandLine|contains:
      - 'update'
      - 'install'
  selection_child_processes:
    ParentImage|endswith: 'InstallUpdate.exe'
    Image|endswith:
      - 'cmd.exe'
      - 'powershell.exe'
      - 'wupdater.exe'
  condition: selection_dropper and selection_child_processes
level: high
status: experimental
